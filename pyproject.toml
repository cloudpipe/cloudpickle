[build-system]
requires = ["flit_core >=3.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "cloudpickle"
authors = [
    { name = "The cloudpickle developer team", email = "cloudpipe@googlegroups.com" },
]
readme = "README.md"
requires-python = ">=3.8"
license = "BSD-3-Clause"
dynamic = ["version", "description"]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Operating System :: POSIX',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: MacOS :: MacOS X',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Distributed Computing',
]

[project.urls]
Homepage = "https://github.com/cloudpipe/cloudpickle"

[tool.black]
line-length = 88
target_version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313']
preview = true

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.pyrefly]
project-includes = ["cloudpickle"]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
implicit-abstract-class = "error"
implicitly-defined-attribute = "error"
not-required-key-access = "error"
open-unpacking = "error"
unannotated-attribute = "error"
untyped-import = "error"
unused-ignore = "error"
variance-mismatch = "error"
# TODO: enable these once everything is annotated
missing-override-decorator = "ignore"
implicit-any = "ignore"
unannotated-parameter = "ignore"
unannotated-return = "ignore"
